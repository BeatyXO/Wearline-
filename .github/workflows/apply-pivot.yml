name: apply-wearline-pivot

on:
  push:
    branches: [wearline-remediation-pivot-predeploy]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect staged payload
        id: payload
        shell: bash
        run: |
          if [ -f .pivot_payload/part00 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize prepared pivot
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .pivot_payload/part* | base64 --decode > /tmp/wearline-pivot.tar.gz
          tar -xzf /tmp/wearline-pivot.tar.gz -C .
          rm -rf .pivot_payload
          rm -f frontend/src/components/AgreementLookup.tsx
          rm -f frontend/src/pages/AgreementPage.tsx
          rm -f frontend/src/pages/SettlementPage.tsx
          rm -f demo/evidence/inconclusive-checkout.png
          rm -f demo/evidence/new-damage-baseline.png
          rm -f demo/evidence/new-damage-checkout.png
          rm -f demo/evidence/normal-wear-baseline.png
          rm -f demo/evidence/normal-wear-checkout.png
          rm -f demo/evidence/normal-wear-v2-baseline.png
          rm -f demo/evidence/normal-wear-v2-checkout.png
          rm -f demo/evidence/unchanged-baseline.png
          rm -f demo/evidence/unchanged-checkout.png
          git checkout HEAD -- .github/workflows/ci.yml .github/workflows/apply-pivot.yml
          python -m unittest tests/test_source_invariants.py -v
          python scripts/check_stale_terms.py
          python -m py_compile contracts/Wearline.py tests/direct_mode_suite.py tests/test_source_invariants.py
      - name: Commit materialized pivot
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Wearline pre-deployment automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Wearline remediation verification pivot"
          git push origin HEAD:wearline-remediation-pivot-predeploy
