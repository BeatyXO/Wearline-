name: wearline-ci

on:
  push:
    branches: [main, wearline-remediation-pivot-predeploy]
  pull_request:

jobs:
  contract-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: genvm-lint check contracts/Wearline.py
      - run: gltest tests/direct_mode_suite.py -q
      - run: python -m unittest tests/test_source_invariants.py -v
      - run: python scripts/check_stale_terms.py
      - run: python -m py_compile contracts/Wearline.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
